name: Build & Release

env:
  SIGNPATH_ORG_ID: ${{ vars.SIGNPATH_ORG_ID }}
  SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
  SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
  SIGNPATH_ARTIFACT_CONFIG_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/package.json
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails
        shell: bash
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Linux dependencies
        run: task build:deps
      - name: Build & Archive Linux binaries
        run: |
          task build:prod ARCH=${{ matrix.arch }}
          tar -czvf Veilora_linux_${{ matrix.arch }}.tar.gz -C build/bin Veilora
          task build:prod-noupdate ARCH=${{ matrix.arch }}
          tar -czvf Veilora_linux_${{ matrix.arch }}_noselfupdate.tar.gz -C build/bin Veilora
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            Veilora_linux_${{ matrix.arch }}.tar.gz
            Veilora_linux_${{ matrix.arch }}_noselfupdate.tar.gz

  # Signed macOS builds require this fork's Apple credentials.
  build-macos:
    if: vars.MACOS_SIGNING_ENABLED == 'true'
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/package.json
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails
        shell: bash
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install macOS dependencies
        run: task build:deps
      - name: Set up keychain profile
        env:
          CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
          CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
        run: |
          CI_KEYCHAIN_PWD=$CI_KEYCHAIN_PWD \
          CERTIFICATE=$CERTIFICATE \
          CERTIFICATE_PWD=$CERTIFICATE_PWD \
          task build:setup-keychain
      - name: Build & archive macOS artifacts
        env:
          CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
        run: |
          CERTIFICATE_NAME=$CERTIFICATE_NAME \
          NOTARIZATION_APPLE_ID=$NOTARIZATION_APPLE_ID \
          NOTARIZATION_TEAM_ID=$NOTARIZATION_TEAM_ID \
          NOTARIZATION_PWD=$NOTARIZATION_PWD \
          task build:prod ARCH=${{ matrix.arch }}
          tar -czvf Veilora_darwin_${{ matrix.arch }}.tar.gz -C build/bin Veilora.app
          mv build/bin/Veilora.dmg build/bin/Veilora-${{ matrix.arch }}.dmg

          CERTIFICATE_NAME=$CERTIFICATE_NAME \
          NOTARIZATION_APPLE_ID=$NOTARIZATION_APPLE_ID \
          NOTARIZATION_TEAM_ID=$NOTARIZATION_TEAM_ID \
          NOTARIZATION_PWD=$NOTARIZATION_PWD \
          task build:prod-noupdate ARCH=${{ matrix.arch }}
          tar -czvf Veilora_darwin_${{ matrix.arch }}_noselfupdate.tar.gz -C build/bin Veilora.app
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}
          path: |
            Veilora_darwin_${{ matrix.arch }}.tar.gz
            build/bin/Veilora-${{ matrix.arch }}.dmg
            Veilora_darwin_${{ matrix.arch }}_noselfupdate.tar.gz

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Ensure git tag exists
        shell: bash
        run: |
          if ! git describe --tags --abbrev=0 2>/dev/null; then
            echo "No tags — creating placeholder v0.0.0"
            git config user.email "ci@veilora.local"
            git config user.name  "Veilora CI"
            git tag v0.0.0
          fi
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/package.json
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails
        shell: bash
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $candidates = @(
            "C:\Program Files (x86)\NSIS",
            "C:\Program Files\NSIS",
            "C:\ProgramData\chocolatey\lib\nsis\tools"
          )
          $nsisPath = $candidates | Where-Object { Test-Path "$_\makensis.exe" } | Select-Object -First 1
          if (-not $nsisPath) {
            $found = Get-ChildItem "C:\" -Recurse -Filter "makensis.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            $nsisPath = $found.DirectoryName
          }
          if (-not $nsisPath) { Write-Error "makensis.exe not found"; exit 1 }
          Write-Host "NSIS found at: $nsisPath"
          $nsisPath | Out-File -Append -FilePath $env:GITHUB_PATH
      - name: Build EXEs
        run: |
          # Prepare output directories
          New-Item -Path .\ci-upload -ItemType Directory -Force
          New-Item -Path .\ci-upload\unsigned -ItemType Directory -Force
          New-Item -Path .\ci-upload\signed -ItemType Directory -Force
          New-Item -Path .\ci-upload\final -ItemType Directory -Force

          # build with self-update
          task build:prod ARCH=${{ matrix.arch }}
          Copy-Item .\build\bin\Veilora.exe .\ci-upload\unsigned\Veilora-selfupdate.exe
          Copy-Item .\build\bin\Veilora-${{ matrix.arch }}-installer.exe .\ci-upload\unsigned\Veilora-installer.exe

          # build without self-update
          task build:prod-noupdate ARCH=${{ matrix.arch }}
          Copy-Item .\build\bin\Veilora.exe .\ci-upload\unsigned\Veilora-noselfupdate.exe
          Copy-Item .\build\bin\Veilora-vpn-sources.zip .\ci-upload\final\Veilora-vpn-sources-${{ matrix.arch }}.zip
          if (Test-Path -LiteralPath "internal/vpn/payload/windows-${{ matrix.arch }}.zip") {
            Write-Host "OpenVPN payload present"
          } else { throw "Missing OpenVPN runtime payload" }
          if ("${{ matrix.arch }}" -eq "amd64") {
            if (Test-Path -LiteralPath "internal/vpn/payload/windows-amd64-softether.zip") {
              Write-Host "SoftEther payload present"
            } else { throw "Missing SoftEther runtime payload" }
            if (Test-Path -LiteralPath "build/bin/Veilora-softether-sources.zip") {
              Copy-Item "build/bin/Veilora-softether-sources.zip" ".\ci-upload\final\Veilora-softether-sources.zip"
              if (Test-Path -LiteralPath "build/bin/Veilora-softether-vcpkg-sources.zip") {
                Copy-Item "build/bin/Veilora-softether-vcpkg-sources.zip" ".\ci-upload\final\Veilora-softether-vcpkg-sources.zip"
              } else { throw "Missing SoftEther vcpkg source archive" }
            } else { throw "Missing SoftEther source archive" }
          }
      - name: Test bundled runtime without external engines
        if: matrix.arch == 'amd64'
        run: go test -tags bundledvpn . ./internal/...
      - name: Upload intermediate unsigned artifacts
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-unsigned-${{ matrix.arch }}
          path: |
            ci-upload/unsigned/Veilora-selfupdate.exe
            ci-upload/unsigned/Veilora-noselfupdate.exe
            ci-upload/unsigned/Veilora-installer.exe
      - name: Sign with SignPath
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@4f13d373e8f0cd8d3c0465ff4877feff27aed2ae # v1.2
        with:
          api-token:                    ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id:              ${{ env.SIGNPATH_ORG_ID }}
          project-slug:                 ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug:          ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug:  ${{ env.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id:           ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion:          true
          output-artifact-directory:    ci-upload/signed
          parameters: |
            arch: "${{ matrix.arch }}"
            version: "${{ github.ref }}"
      - name: Prepare final artifacts using unsigned artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || vars.SIGNPATH_ENABLED != 'true' }}
        run: |
          Move-Item -Path .\ci-upload\unsigned\Veilora-installer.exe `
                          -Destination .\ci-upload\final\Veilora-${{ matrix.arch }}-installer.exe
          # Build the self-update archive
          Copy-Item `
            -Path .\ci-upload\unsigned\Veilora-selfupdate.exe `
            -Destination .\ci-upload\unsigned\Veilora.exe `
            -Force
          Compress-Archive `
            -Path .\ci-upload\unsigned\Veilora.exe `
            -DestinationPath .\ci-upload\final\Veilora_windows_${{ matrix.arch }}.zip
          Remove-Item -Path .\ci-upload\unsigned\Veilora.exe
          # Build the no-self-update archive
          Copy-Item `
            -Path .\ci-upload\unsigned\Veilora-noselfupdate.exe `
            -Destination .\ci-upload\unsigned\Veilora.exe `
            -Force
          Compress-Archive `
            -Path .\ci-upload\unsigned\Veilora.exe `
            -DestinationPath .\ci-upload\final\Veilora_windows_${{ matrix.arch }}_noselfupdate.zip
      - name: Prepare final artifacts using signed artifacts
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ENABLED == 'true'
        run: |
          Move-Item -Path .\ci-upload\signed\Veilora-installer.exe `
                          -Destination .\ci-upload\final\Veilora-${{ matrix.arch }}-installer.exe
          # Build the self-update archive
          Copy-Item `
            -Path .\ci-upload\signed\Veilora-selfupdate.exe `
            -Destination .\ci-upload\signed\Veilora.exe `
            -Force
          Compress-Archive `
            -Path .\ci-upload\signed\Veilora.exe `
            -DestinationPath .\ci-upload\final\Veilora_windows_${{ matrix.arch }}.zip
          Remove-Item -Path .\ci-upload\signed\Veilora.exe
          # Build the no-self-update archive
          Copy-Item `
            -Path .\ci-upload\signed\Veilora-noselfupdate.exe `
            -Destination .\ci-upload\signed\Veilora.exe `
            -Force
          Compress-Archive `
            -Path .\ci-upload\signed\Veilora.exe `
            -DestinationPath .\ci-upload\final\Veilora_windows_${{ matrix.arch }}_noselfupdate.zip
      - name: Upload final artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-final-${{ matrix.arch }}
          path: |
            ci-upload/final/Veilora_windows_${{ matrix.arch }}.zip
            ci-upload/final/Veilora_windows_${{ matrix.arch }}_noselfupdate.zip
            ci-upload/final/Veilora-${{ matrix.arch }}-installer.exe

  release:
    permissions:
      # https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-to-establish-provenance-for-builds#generating-build-provenance-for-binaries
      id-token: write
      attestations: write
      # https://github.com/softprops/action-gh-release/issues/236
      contents: write
    name: Attest & Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: linux-*
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: macos-*
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: windows-final-*
          path: artifacts
      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-path: artifacts/**
      - name: Update rolling latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: artifacts/**
          tag_name: latest
          name: Latest Veilora builds
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Latest automated Veilora builds.

            Source commit: `${{ github.sha }}`

            Windows and Linux builds are automated. macOS artifacts require repository signing credentials.

      - name: Create versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: artifacts/**
          tag_name: ${{ github.ref }}
          draft: true
