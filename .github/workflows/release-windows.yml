name: Build Windows Installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: false
        default: 'amd64'
        type: choice
        options: [amd64, arm64]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Windows Installer (${{ github.event.inputs.arch || 'amd64' }})
    runs-on: windows-2022

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Ensure a git tag exists (wails uses git describe for version) ───────
      - name: Ensure git tag exists
        shell: bash
        run: |
          if ! git describe --tags --abbrev=0 2>/dev/null; then
            echo "No tags found — creating placeholder v0.0.0"
            git config user.email "ci@veilora.local"
            git config user.name  "Veilora CI"
            git tag v0.0.0
          fi

      # ── Toolchain ───────────────────────────────────────────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # ── Install Wails ────────────────────────────────────────────────────────
      - name: Install Wails
        shell: bash
        run: |
          WAILS_VER=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          echo "Installing wails $WAILS_VER"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VER}"
          wails version

      # ── Install NSIS ─────────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # Search for makensis.exe in known locations
          $candidates = @(
            "C:\Program Files (x86)\NSIS",
            "C:\Program Files\NSIS",
            "C:\ProgramData\chocolatey\lib\nsis\tools"
          )
          $nsisPath = $candidates | Where-Object { Test-Path "$_\makensis.exe" } | Select-Object -First 1
          if (-not $nsisPath) {
            $found = Get-ChildItem "C:\" -Recurse -Filter "makensis.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            $nsisPath = $found.DirectoryName
          }
          if (-not $nsisPath) { Write-Error "makensis.exe not found after choco install"; exit 1 }
          Write-Host "NSIS path: $nsisPath"
          $nsisPath | Out-File -Append -FilePath $env:GITHUB_PATH

      # ── Install frontend dependencies ─────────────────────────────────────────
      - name: Install frontend dependencies
        shell: bash
        working-directory: frontend
        run: npm ci

      # ── Build installer (automatic updates disabled, produces Veilora-amd64-installer.exe) ─
      - name: Build installer
        shell: bash
        run: task build:prod ARCH=${{ github.event.inputs.arch || 'amd64' }}

      - name: Verify bundled engine payload manifests
        shell: pwsh
        run: |
          $arch = "${{ github.event.inputs.arch || 'amd64' }}"
          $openvpn = "internal/vpn/payload/windows-$arch.zip"
          if (-not (Test-Path $openvpn)) { throw "Missing OpenVPN runtime payload: $openvpn" }
          if ($arch -eq 'amd64') {
            $softether = "internal/vpn/payload/windows-amd64-softether.zip"
            if (-not (Test-Path $softether)) { throw "Missing SoftEther runtime payload: $softether" }
          }

      # Save the self-update Veilora.exe NOW before prod-noupdate overwrites it
      - name: Stage self-update binary
        shell: pwsh
        run: |
          New-Item -Path output -ItemType Directory -Force
          Copy-Item "build\bin\Veilora.exe" "output\Veilora-selfupdate.exe"
          Write-Host "Staged self-update binary"

      # ── Build portable (no self-update) ──────────────────────────────────────
      - name: Build portable (no self-update)
        shell: bash
        run: task build:prod-noupdate ARCH=${{ github.event.inputs.arch || 'amd64' }}

      - name: Verify source-built runtime on isolated Windows runner
        if: (github.event.inputs.arch || 'amd64') == 'amd64'
        env:
          VEILORA_NATIVE_SMOKE: '1'
        run: go test -tags bundledvpn . ./internal/...

      # ── Package artifacts ─────────────────────────────────────────────────────
      - name: Package artifacts
        shell: pwsh
        run: |
          $arch = "${{ github.event.inputs.arch || 'amd64' }}"

          # Installer exe (produced by -nsis flag in prod task)
          Copy-Item "build\bin\Veilora-${arch}-installer.exe" "output\Veilora-${arch}-installer.exe"
          Copy-Item "build\bin\Veilora-vpn-sources.zip" "output\Veilora-vpn-sources.zip"
          if (Test-Path "build\bin\Veilora-softether-sources.zip") {
            Copy-Item "build\bin\Veilora-softether-sources.zip" "output\Veilora-softether-sources.zip"
            if (Test-Path "build\bin\Veilora-softether-vcpkg-sources.zip") {
              Copy-Item "build\bin\Veilora-softether-vcpkg-sources.zip" "output\Veilora-softether-vcpkg-sources.zip"
            } else { throw "Missing SoftEther vcpkg source archive" }
          } elseif ($arch -eq 'amd64') {
            throw "Missing SoftEther source archive"
          }

          # Portable zip — self-update build (staged before prod-noupdate ran)
          Compress-Archive -Path "output\Veilora-selfupdate.exe" -DestinationPath "output\Veilora_windows_${arch}.zip"
          Remove-Item "output\Veilora-selfupdate.exe"

          # Portable zip — no self-update build (current build\bin\Veilora.exe)
          Copy-Item "build\bin\Veilora.exe" "output\Veilora-noselfupdate.exe"
          Compress-Archive -Path "output\Veilora-noselfupdate.exe" -DestinationPath "output\Veilora_windows_${arch}_noselfupdate.zip"
          Remove-Item "output\Veilora-noselfupdate.exe"

          Write-Host "Output contents:"
          Get-ChildItem output | Format-Table Name, Length

      # ── Upload artifacts ─────────────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.event.inputs.arch || 'amd64' }}
          path: output/

      # ── Create GitHub Release (on tag push) ──────────────────────────────────
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: output/*
          name: ${{ github.ref_name }}
          body: |
            ## Veilora Desktop ${{ github.ref_name }}

            ### Windows Downloads
            | File | Description |
            |------|-------------|
            | `Veilora-amd64-installer.exe` | NSIS installer with WebView2 bootstrapper |
            | `Veilora_windows_amd64.zip` | Portable executable (automatic updates disabled) |
            | `Veilora_windows_amd64_noselfupdate.zip` | Portable executable (no self-update) |

            ### What's included
            - Ad-blocking proxy (Veilora core)
            - Bundled OpenVPN runtime and signed TAP driver; no separately installed VPN client required
            - Optional integration with an existing SoftEther client
            - Free VPN servers from VPNGate (updated automatically)
            - Custom DNS controls (kill switch unavailable; live leak protection unverified)
