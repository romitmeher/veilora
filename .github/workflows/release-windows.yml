name: Build Windows Installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: false
        default: 'amd64'
        type: choice
        options: [amd64, arm64]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Windows Installer (${{ github.event.inputs.arch || 'amd64' }})
    runs-on: windows-2022

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Ensure a git tag exists (wails uses git describe for version) ───────
      - name: Ensure git tag exists
        shell: bash
        run: |
          if ! git describe --tags --abbrev=0 2>/dev/null; then
            echo "No tags found — creating placeholder v0.0.0"
            git config user.email "ci@zen-desktop.local"
            git config user.name  "Zen CI"
            git tag v0.0.0
          fi

      # ── Toolchain ───────────────────────────────────────────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # ── Install Wails ────────────────────────────────────────────────────────
      - name: Install Wails
        shell: bash
        run: |
          WAILS_VER=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          echo "Installing wails $WAILS_VER"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VER}"
          wails version

      # ── Install NSIS ─────────────────────────────────────────────────────────
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # Search for makensis.exe in known locations
          $candidates = @(
            "C:\Program Files (x86)\NSIS",
            "C:\Program Files\NSIS",
            "C:\ProgramData\chocolatey\lib\nsis\tools"
          )
          $nsisPath = $candidates | Where-Object { Test-Path "$_\makensis.exe" } | Select-Object -First 1
          if (-not $nsisPath) {
            $found = Get-ChildItem "C:\" -Recurse -Filter "makensis.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            $nsisPath = $found.DirectoryName
          }
          if (-not $nsisPath) { Write-Error "makensis.exe not found after choco install"; exit 1 }
          Write-Host "NSIS path: $nsisPath"
          $nsisPath | Out-File -Append -FilePath $env:GITHUB_PATH

      # ── Install frontend dependencies ─────────────────────────────────────────
      - name: Install frontend dependencies
        shell: bash
        working-directory: frontend
        run: npm ci

      # ── Build installer (self-update enabled, produces Zen-amd64-installer.exe) ─
      - name: Build installer
        shell: bash
        run: task build:prod ARCH=${{ github.event.inputs.arch || 'amd64' }}

      # Save the self-update Zen.exe NOW before prod-noupdate overwrites it
      - name: Stage self-update binary
        shell: pwsh
        run: |
          New-Item -Path output -ItemType Directory -Force
          Copy-Item "build\bin\Zen.exe" "output\Zen-selfupdate.exe"
          Write-Host "Staged self-update binary"

      # ── Build portable (no self-update) ──────────────────────────────────────
      - name: Build portable (no self-update)
        shell: bash
        run: task build:prod-noupdate ARCH=${{ github.event.inputs.arch || 'amd64' }}

      # ── Package artifacts ─────────────────────────────────────────────────────
      - name: Package artifacts
        shell: pwsh
        run: |
          $arch = "${{ github.event.inputs.arch || 'amd64' }}"

          # Installer exe (produced by -nsis flag in prod task)
          Copy-Item "build\bin\Zen-${arch}-installer.exe" "output\Zen-${arch}-installer.exe"

          # Portable zip — self-update build (staged before prod-noupdate ran)
          Compress-Archive -Path "output\Zen-selfupdate.exe" -DestinationPath "output\Zen_windows_${arch}.zip"
          Remove-Item "output\Zen-selfupdate.exe"

          # Portable zip — no self-update build (current build\bin\Zen.exe)
          Copy-Item "build\bin\Zen.exe" "output\Zen-noselfupdate.exe"
          Compress-Archive -Path "output\Zen-noselfupdate.exe" -DestinationPath "output\Zen_windows_${arch}_noselfupdate.zip"
          Remove-Item "output\Zen-noselfupdate.exe"

          Write-Host "Output contents:"
          Get-ChildItem output | Format-Table Name, Length

      # ── Upload artifacts ─────────────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.event.inputs.arch || 'amd64' }}
          path: output/

      # ── Create GitHub Release (on tag push) ──────────────────────────────────
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: output/*
          name: ${{ github.ref_name }}
          body: |
            ## Zen Desktop ${{ github.ref_name }}

            ### Windows Downloads
            | File | Description |
            |------|-------------|
            | `Zen-amd64-installer.exe` | NSIS installer with WebView2 bootstrapper |
            | `Zen_windows_amd64.zip` | Portable executable (self-update enabled) |
            | `Zen_windows_amd64_noselfupdate.zip` | Portable executable (no self-update) |

            ### What's included
            - Ad-blocking proxy (Zen core)
            - VPN support via OpenVPN and SoftEther
            - Free VPN servers from VPNGate (updated automatically)
            - Kill switch and DNS leak protection
