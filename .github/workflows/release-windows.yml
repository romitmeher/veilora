name: Build Windows Installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: false
        default: 'amd64'
        type: choice
        options: [amd64, arm64]

permissions:
  contents: write

jobs:
  build:
    name: Windows Installer (${{ github.event.inputs.arch || 'amd64' }})
    runs-on: windows-2022

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for `git describe --tags`

      # ── Toolchain ───────────────────────────────────────────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # ── Install Wails ────────────────────────────────────────────────────────
      - name: Install Wails
        shell: bash
        run: |
          WAILS_VER=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VER}"

      # ── Install NSIS ─────────────────────────────────────────────────────────
      - name: Install NSIS
        run: |
          winget install --id NSIS.NSIS --accept-source-agreements --accept-package-agreements -e
          echo "$env:ProgramFiles(x86)\NSIS" | Out-File -Append -FilePath $env:GITHUB_PATH
        shell: pwsh

      # ── Build installer (with self-update) ───────────────────────────────────
      - name: Build installer
        shell: bash
        run: task build:prod ARCH=${{ github.event.inputs.arch || 'amd64' }}

      # ── Build portable exe (no self-update) ──────────────────────────────────
      - name: Build portable (no self-update)
        shell: bash
        run: task build:prod-noupdate ARCH=${{ github.event.inputs.arch || 'amd64' }}

      # ── Package artifacts ────────────────────────────────────────────────────
      - name: Package artifacts
        shell: pwsh
        run: |
          $arch = "${{ github.event.inputs.arch || 'amd64' }}"
          New-Item -Path output -ItemType Directory -Force

          # Installer
          Copy-Item "build\bin\Zen-${arch}-installer.exe" "output\Zen-${arch}-installer.exe"

          # Portable zip (self-update build)
          Copy-Item "build\bin\Zen.exe" "output\Zen.exe"
          Compress-Archive -Path "output\Zen.exe" -DestinationPath "output\Zen_windows_${arch}.zip"
          Remove-Item "output\Zen.exe"

          # Portable zip (no self-update build)
          $noUpdateExe = "build\bin\Zen.exe"
          Copy-Item $noUpdateExe "output\Zen.exe"
          Compress-Archive -Path "output\Zen.exe" -DestinationPath "output\Zen_windows_${arch}_noselfupdate.zip"
          Remove-Item "output\Zen.exe"

          Get-ChildItem output

      # ── Upload artifacts ─────────────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.event.inputs.arch || 'amd64' }}
          path: output/

      # ── Create GitHub Release (on tag push) ──────────────────────────────────
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: output/*
          name: ${{ github.ref_name }}
          body: |
            ## Zen Desktop ${{ github.ref_name }}

            ### Windows Downloads
            | File | Description |
            |------|-------------|
            | `Zen-amd64-installer.exe` | NSIS installer with WebView2 bootstrapper |
            | `Zen_windows_amd64.zip` | Portable executable (self-update enabled) |
            | `Zen_windows_amd64_noselfupdate.zip` | Portable executable (no self-update) |

            ### What's included
            - Ad-blocking proxy (Zen core)
            - VPN support via OpenVPN and SoftEther
            - Free VPN servers from VPNGate (updated automatically)
            - Kill switch and DNS leak protection
